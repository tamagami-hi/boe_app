name: boe_prod_admin_tailnet

services:
  tailscale:
    image: ${TAILSCALE_IMAGE:?set TAILSCALE_IMAGE in .env to a pinned tailscale/tailscale version tag}
    container_name: boe-prod-admin-tailnet
    hostname: boe-prod-admin
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: boe-prod-admin
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailnet_state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    networks:
      - admin_proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  admin_proxy:
    name: boe_prod_admin_proxy
    ipam:
      config:
        - subnet: 10.251.47.0/24
          gateway: 10.251.47.1

volumes:
  tailnet_state:
    name: boe_prod_admin_tailnet_state
