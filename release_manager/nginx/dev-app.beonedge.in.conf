# ─────────────────────────────────────────────────────────────────────────────
# dev-app.beonedge.in — DEVELOPMENT user application.
#
# INSTALL TO:  /etc/nginx/sites-available/boe-dev-app (then symlink into sites-enabled)
# REQUIRES:    /etc/nginx/conf.d/boe-shared.conf
#              /etc/nginx/snippets/boe-security-headers.conf
#
# Public ingress is via the Cloudflare Tunnel (cloudflared runs on the VPS and
# connects to this port-80 server block on localhost). There is no port-443
# block and no certbot/TLS here — TLS terminates at the Cloudflare edge, so do
# NOT run certbot for this host. The real visitor IP is recovered from
# CF-Connecting-IP via the real-IP section in boe-shared.conf.
#
# ── SAME-ORIGIN CONTRACT ────────────────────────────────────────────────────
# The browser loads the page and calls the API on the SAME origin:
#     https://dev-app.beonedge.in/           → user SPA
#     https://dev-app.beonedge.in/api/...    → backend
# so there is no CORS preflight, cookies are host-only, and CSRF protection is
# straightforward.
#
# ── WHY proxy_pass HAS A TRAILING SLASH ─────────────────────────────────────
# The backend's real routes have NO /api prefix — they are /health/ready,
# /v1/health, /auth/..., and so on. A trailing slash on proxy_pass makes nginx
# STRIP the matched /api/ prefix:
#     /api/health/ready  →  /health/ready
#     /api/v1/portfolio  →  /v1/portfolio
# If the backend is ever changed to serve routes under /api itself, remove the
# trailing slash from proxy_pass here and in every other BOE_APP site config.
#
# PORTS: from dev_release/.env — BACKEND_PORT=47423, APP_FRONTEND_PORT=47421.
# Change both together and reload nginx.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;

    server_name dev-app.beonedge.in;

    include /etc/nginx/snippets/boe-security-headers.conf;

    # Certificate renewal must keep working over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
        auth_basic off;
    }

    # Uploads and document submissions.
    client_max_body_size 10m;

    # ── development access protection (plan §11) ────────────────────────────
    # The dev stack must not rely on the application login alone: it is reachable
    # from the internet, holds test accounts with weak passwords, and must never
    # be indexed. Create the htpasswd file (OPERATOR_MANUAL_STEPS.md §5.6), then
    # uncomment these two lines and reload nginx.
    #
    # auth_basic           "BeOnEdge Development";
    # auth_basic_user_file /etc/nginx/auth/dev-testers.htpasswd;

    # Keep the development stack out of search results.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # ── authentication endpoints: strictest limit ───────────────────────────
    # Declared before the general /api/ block so it wins for these exact paths.
    #
    # These MUST be the paths the backend actually serves. The previous pattern
    # matched /api/auth/login, /api/auth/register, /api/auth/password-reset and
    # /api/auth/otp — none of which this backend registers. The canonical routes
    # are /v1/auth/native/login (client app) and /v1/auth/web/login (admin
    # console), so every real sign-in fell through to the general /api/ block at
    # 20r/s and the brute-force limit was never in force on anything.
    #
    # Anchored with $ and naming only `login`: /v1/auth/native/refresh and
    # /v1/auth/web/csrf are called routinely by a healthy client, and a 5r/m
    # limit on those would break the app.
    #
    # Sign-in is also expensive server-side (Argon2id, ~19 MiB per attempt), so
    # this limit protects CPU as well as credentials. It cannot be the only such
    # protection: a limit keyed on the client address does nothing about a scan
    # spread across many addresses, which is why the backend additionally bounds
    # hashing concurrency (see backend_controller/src/auth/passwordGate.ts).
    #
    # burst raised from 5 to 10: Indian mobile carriers use CGNAT, so several
    # genuine clients can share one public address, and this is a sign-in path
    # whose failure mode is exactly the complaint it exists to prevent. The
    # sustained rate (5r/m, see boe-shared.conf) is unchanged.
    #
    # A regex location cannot carry a URI on proxy_pass, so the /api prefix is
    # stripped with `rewrite ... break` instead of a trailing slash.
    location ~ ^/api/v1/auth/(native|web)/login$ {
        limit_req zone=boe_auth burst=10 nodelay;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:47423;

        proxy_buffering off;
    }

    # ── external signup door: stricter than general, looser than auth ───────
    # The marketing site on AWS posts here, authenticated by the x-signup-key
    # shared secret the backend checks. Declared before /api/ so it wins.
    # See boe-shared.conf for why this needs its own zone despite being authed.
    location = /api/newuser {
        limit_req zone=boe_signup burst=20 nodelay;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:47423;

        proxy_buffering off;
    }

    location = /payment-return {
        access_log off;
        limit_req zone=boe_general burst=40 nodelay;
        proxy_pass http://127.0.0.1:47423/payment-return;
        proxy_buffering off;
    }

    # ── backend API ─────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=boe_general burst=40 nodelay;

        # Trailing slash strips /api/ — see the header note.
        proxy_pass http://127.0.0.1:47423/;

        # Streaming responses must not be buffered.
        proxy_buffering off;
    }

    # ── WebSocket ───────────────────────────────────────────────────────────
    # The backend has NO WebSocket support today (no ws / socket.io /
    # @fastify/websocket anywhere). Uncomment when it does.
    #
    # location /ws/ {
    #     proxy_pass http://127.0.0.1:47423/;
    #     proxy_set_header Upgrade    $http_upgrade;
    #     proxy_set_header Connection $connection_upgrade;
    #     proxy_read_timeout 3600s;
    #     proxy_send_timeout 3600s;
    # }

    # ── health probes: never public ─────────────────────────────────────────
    # Exposing readiness publicly leaks dependency state and gives an unauthenticated
    # attacker a cheap liveness oracle.
    location /api/health/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:47423/health/;
    }

    # ── APK downloads ───────────────────────────────────────────────────────
    # Serves the release holder directories that `apk_ship.sh` publishes into,
    # so the in-app updater has somewhere to download from. The backend reads the
    # same directories (mounted read-only) to answer GET /api/v1/app/update, and
    # the app verifies the SHA-256 from that answer against the bytes it receives
    # before handing the file to the package installer.
    #
    # Deliberately narrow: one regex that matches ONLY a plain `.apk` filename
    # under a known variant. That excludes the sidecar JSONs (which carry build
    # metadata nobody needs publicly), excludes directory listings, and makes
    # path traversal impossible — `..` cannot match the filename character class.
    #
    # Capture groups are interpolated into `alias`, which is why the two variant
    # directories have to be named explicitly rather than derived.
    location ~ "^/downloads/client/([A-Za-z0-9][A-Za-z0-9._-]*\.apk)$" {
        alias /srv/dev_stack/BOE_APP/dev_release/dev_apk/$1;

        # If dev basic auth is enabled above, the updater cannot supply
        # credentials — the download must stay open or in-app updates break.
        auth_basic off;

        # APK filenames are immutable (the version is in the name), so a long
        # cache is safe and keeps re-downloads off the VPS.
        add_header Cache-Control "public, max-age=86400, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location ~ "^/downloads/admin/([A-Za-z0-9][A-Za-z0-9._-]*\.apk)$" {
        alias /srv/dev_stack/BOE_APP/dev_release/dev_admin_apk/$1;
        auth_basic off;
        add_header Cache-Control "public, max-age=86400, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Anything else under /downloads/ is not a published artifact.
    location /downloads/ {
        return 404;
    }

    # ── user SPA ────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:47421;
    }
}
