# ─────────────────────────────────────────────────────────────────────────────
# monitor.beonedge.in — Grafana (monitoring stack).
#
# INSTALL TO:  /etc/nginx/sites-available/boe-monitor
# REQUIRES:    /etc/nginx/conf.d/boe-shared.conf
#              /etc/nginx/snippets/boe-security-headers.conf
#
#     sudo certbot --nginx -d monitor.beonedge.in
#
# ── THIS HOST MUST BE LOCKED DOWN HARDER THAN THE APPLICATION ───────────────
# Grafana can see infrastructure topology, database size, error rates and
# deployment history. Treat read access as sensitive.
#
# Layers, in order of preference:
#   1. Tailscale-only exposure (best — do not publish this vhost at all)
#   2. nginx basic auth in front of Grafana's own login (configured below)
#   3. Grafana authentication with anonymous access disabled (set in compose)
#
# Prometheus (47431), Alertmanager (47432) and Blackbox (47433) are deliberately
# NOT proxied here. They are loopback debugging ports. Do not add them.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;

    server_name monitor.beonedge.in;

    include /etc/nginx/snippets/boe-security-headers.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
        auth_basic off;
    }

    # ── access protection ───────────────────────────────────────────────────
    # Create the file (OPERATOR_MANUAL_STEPS.md §5.6) then uncomment.
    #
    # auth_basic           "BeOnEdge Monitoring";
    # auth_basic_user_file /etc/nginx/auth/monitor.htpasswd;

    # Optional, stronger: restrict to the Tailscale CGNAT range and the LAN,
    # so the dashboard is unreachable from the public internet entirely.
    #
    # allow 100.64.0.0/10;      # tailscale
    # allow 192.168.1.0/24;     # LAN
    # deny  all;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    client_max_body_size 2m;

    # Grafana's live-tail and alerting UI use WebSockets; unlike the application
    # backend, this one genuinely needs the upgrade path.
    location /api/live/ {
        proxy_pass http://127.0.0.1:47430;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        limit_req zone=boe_monitor burst=20 nodelay;
        proxy_pass http://127.0.0.1:47430;
    }
}
