# ─────────────────────────────────────────────────────────────────────────────
# admin.boe.app.internal — admin application, PRIVATE internal name.
#
# INSTALL TO:  /etc/nginx/sites-available/boe-admin-tailscale (then symlink into sites-enabled)
# REQUIRES:    /etc/nginx/conf.d/boe-shared.conf
#              /etc/nginx/snippets/boe-security-headers.conf
#
# ── HOW THIS VHOST IS PRIVATE ───────────────────────────────────────────────
# Two independent layers, BOTH required:
#
#   1. NAME: admin.boe.app.internal has no public DNS record. It exists only in
#      /etc/hosts on your devices, pointing at the Tailscale IP:
#          100.122.85.101  admin.boe.app.internal
#      so only machines you have configured can even find it.
#
#   2. NETWORK GUARD: the allow/deny block below restricts this vhost to the
#      Tailscale CGNAT range and loopback. This matters because the vhost
#      listens on the SHARED wildcard :80 — without the guard, anyone who can
#      reach port 80 on any interface (LAN, a future tunnel hostname) could
#      reach the admin panel merely by setting the Host header.
#
# ── WHY WILDCARD listen AND NOT listen 100.122.85.101:80 ────────────────────
# An explicit `listen <IP>:80` claims that whole socket: nginx stops consulting
# wildcard vhosts for connections to that IP regardless of Host header (this
# once knocked tickvault.beonedge.internal offline). Sharing the wildcard :80
# with server_name matching lets any number of .internal apps coexist cleanly.
#
# ── NO TLS / NO CERTBOT ─────────────────────────────────────────────────────
# Tailscale traffic is already end-to-end WireGuard-encrypted between devices.
# Tailscale Serve / MagicDNS-issued certs are an OPTIONAL future upgrade.
#
# ── UFW ─────────────────────────────────────────────────────────────────────
# ufw default-denies inbound on ALL interfaces, including tailscale0, so it
# must explicitly allow this port:
#     sudo ufw allow in on tailscale0 to any port 80
#
# ── WHICH STACK THIS TALKS TO ───────────────────────────────────────────────
# The dev stack: backend 47423 (boe-dev-backend), admin SPA 47422 (boe-dev-admin).
#
# That is deliberate and it is the only admin console there is. There is no admin
# domain — no admin.beonedge.in, no dev-admin.beonedge.in — so this vhost is the
# single door to the web console, and today the only stack running is dev.
#
# When the production stack goes live, decide explicitly which one an operator
# reaching this hostname should get, and change BOTH ports together:
#     dev  → 47423 (backend) + 47422 (admin SPA)
#     prod → 47413 (backend) + 47412 (admin SPA)
# Getting this half-right is worse than either choice: an operator who believes
# they are on dev while the console is wired to prod will act on real investor
# data. Verify after any change with `curl -s http://admin.boe.app.internal/api/health/live`
# and confirm the version it reports is the stack you meant.
#
# ── PREREQUISITE ────────────────────────────────────────────────────────────
# The admin frontend container must be running on 127.0.0.1:47422 or every
# request to / will 502.
#
# ── SAME-ORIGIN CONTRACT ────────────────────────────────────────────────────
# The browser loads the page and calls the API on the SAME origin:
#     http://admin.boe.app.internal/           → admin SPA
#     http://admin.boe.app.internal/api/...    → backend
# so there is no CORS preflight, cookies are host-only, and CSRF protection is
# straightforward.
#
# ── WHY proxy_pass HAS A TRAILING SLASH ─────────────────────────────────────
# The backend's real routes have NO /api prefix — they are /health/ready,
# /v1/health, /auth/..., and so on. A trailing slash on proxy_pass makes nginx
# STRIP the matched /api/ prefix:
#     /api/health/ready  →  /health/ready
#     /api/v1/portfolio  →  /v1/portfolio
# If the backend is ever changed to serve routes under /api itself, remove the
# trailing slash from proxy_pass here and in every other BOE_APP site config.
#
# PORTS: from prod_release/.env — BACKEND_PORT=47413, APP_FRONTEND_PORT=47412.
# Change both together and reload nginx.
#
# ── TEMPORARY PORT DIVERGENCE ───────────────────────────────────────────────
# This repo file targets the PROD stack (47412/47413). The copy installed on
# the VPS was sed-switched to the DEV stack (47422/47423) on 2026-08-04 because
# prod containers are not deployed yet. Re-copy this file to the VPS when the
# prod stack goes live; until then the VPS copy and this file intentionally
# differ only in port numbers.
# ─────────────────────────────────────────────────────────────────────────────

server {
    # Shared wildcard :80 — name-based routing, NOT a dedicated socket.
    listen 80;
    listen [::]:80;

    server_name admin.boe.app.internal;

    # ── network guard (layer 2 of 2 — see header) ───────────────────────────
    # Tailnet devices and loopback only. Everything else gets 403 even with a
    # correct Host header.
    allow 100.64.0.0/10;    # tailscale CGNAT range
    allow 127.0.0.1;
    allow ::1;
    deny all;

    include /etc/nginx/snippets/boe-security-headers.conf;

    # Uploads and document submissions.
    client_max_body_size 10m;

    # ── authentication endpoints: strictest limit ───────────────────────────
    # Declared before the general /api/ block so it wins for these exact paths.
    #
    # These MUST be the paths the backend actually serves. The previous pattern
    # matched /api/auth/login, /api/auth/register, /api/auth/password-reset and
    # /api/auth/otp — none of which this backend registers. The canonical routes
    # are /v1/auth/native/login (client app) and /v1/auth/web/login (admin
    # console), so every real sign-in fell through to the general /api/ block at
    # 20r/s and the brute-force limit was never in force on anything.
    #
    # Anchored with $ and naming only `login`: /v1/auth/native/refresh and
    # /v1/auth/web/csrf are called routinely by a healthy client, and a 5r/m
    # limit on those would break the app.
    #
    # Sign-in is also expensive server-side (Argon2id, ~19 MiB per attempt), so
    # this limit protects CPU as well as credentials. It cannot be the only such
    # protection: a limit keyed on the client address does nothing about a scan
    # spread across many addresses, which is why the backend additionally bounds
    # hashing concurrency (see backend_controller/src/auth/passwordGate.ts).
    #
    # burst raised from 5 to 10: Indian mobile carriers use CGNAT, so several
    # genuine clients can share one public address, and this is a sign-in path
    # whose failure mode is exactly the complaint it exists to prevent. The
    # sustained rate (5r/m, see boe-shared.conf) is unchanged.
    #
    # A regex location cannot carry a URI on proxy_pass, so the /api prefix is
    # stripped with `rewrite ... break` instead of a trailing slash.
    location ~ ^/api/v1/auth/(native|web)/login$ {
        limit_req zone=boe_auth burst=10 nodelay;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:47423;

        proxy_buffering off;
    }

    # ── backend API ─────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=boe_general burst=40 nodelay;

        # Trailing slash strips /api/ — see the header note.
        proxy_pass http://127.0.0.1:47423/;

        # Streaming responses must not be buffered.
        proxy_buffering off;
    }

    # ── WebSocket ───────────────────────────────────────────────────────────
    # The backend has NO WebSocket support today (no ws / socket.io /
    # @fastify/websocket anywhere). Uncomment when it does.
    #
    # location /ws/ {
    #     proxy_pass http://127.0.0.1:47423/;
    #     proxy_set_header Upgrade    $http_upgrade;
    #     proxy_set_header Connection $connection_upgrade;
    #     proxy_read_timeout 3600s;
    #     proxy_send_timeout 3600s;
    # }

    # ── health probes: never public ─────────────────────────────────────────
    # Exposing readiness publicly leaks dependency state and gives an unauthenticated
    # attacker a cheap liveness oracle. Loopback-only even inside the tailnet.
    location /api/health/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:47423/health/;
    }

    # ── admin SPA ────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:47422;
    }
}
