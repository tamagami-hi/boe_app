# ─────────────────────────────────────────────────────────────────────────────
# beonedge-vps.tail4ea2bc.ts.net — admin console. PRIVATE to the tailnet, HTTPS.
#
# INSTALL TO:  /etc/nginx/sites-available/boe-admin-tailscale (then symlink into sites-enabled)
# REQUIRES:    /etc/nginx/conf.d/boe-shared.conf
#              /etc/nginx/snippets/boe-security-headers.conf
#              a Tailscale-issued certificate — see CERTIFICATE below
#
# ── WHY THIS HOSTNAME AND NOT admin.boe.app.internal ────────────────────────
# The browser console authenticates with the HttpOnly web-session cookies
# __Host-boe_access / __Host-boe_refresh (WEB_COOKIE_SECURE=true). The __Host-
# prefix is only honoured by browsers over HTTPS, so the console CANNOT work on a
# plain-HTTP origin at all: the login POST succeeds, the browser silently discards
# the Set-Cookie, and the very next request is unauthenticated. Nothing in the
# application can work around that — it is a browser rule.
#
# `.internal` is ICANN-reserved for private use, so no public CA will ever issue
# for it; HTTPS on that name means running a private CA and installing it on
# every operator device. The tailnet's own MagicDNS name avoids all of it:
# `tailscale cert` issues a genuinely-trusted Let's Encrypt certificate, so every
# tailnet device — phones included — gets a clean HTTPS origin with no
# trust-store work, and MagicDNS resolves it without an /etc/hosts entry.
#
# admin.boe.app.internal is therefore retired to a 301 below, so an old bookmark
# lands on the working URL instead of a console that cannot hold a session.
#
# ── HOW THIS VHOST IS PRIVATE ───────────────────────────────────────────────
# Two independent layers, BOTH required:
#
#   1. NAME: a *.ts.net MagicDNS name resolves only on devices signed into this
#      tailnet. It is not in public DNS.
#
#   2. NETWORK GUARD: the allow/deny block, repeated in EVERY server block below,
#      restricts this vhost to the Tailscale CGNAT range and loopback. This
#      matters because these blocks listen on the SHARED wildcard :80/:443 —
#      without the guard, anything that can reach either port on any interface
#      (the LAN, or the Cloudflare Tunnel, which terminates on 127.0.0.1:80)
#      could reach the admin console merely by setting the Host header.
#
#      The guard MUST be repeated in every server block. nginx does not inherit
#      it from a sibling, and a block without it is a public admin console.
#
# ── CERTIFICATE ─────────────────────────────────────────────────────────────
# Needs "HTTPS Certificates" enabled for the tailnet (Tailscale admin console →
# DNS) and MagicDNS on. Issue once:
#
#     sudo mkdir -p /etc/nginx/tls
#     sudo tailscale cert \
#         --cert-file /etc/nginx/tls/beonedge-vps.tail4ea2bc.ts.net.crt \
#         --key-file  /etc/nginx/tls/beonedge-vps.tail4ea2bc.ts.net.key \
#         beonedge-vps.tail4ea2bc.ts.net
#
# These certificates are short-lived (~90 days) and renewal is NOT automatic for
# one written to disk for another process to read. Re-run the same command and
# reload nginx; `tailscale cert` only does real work when expiry is near, so a
# daily job is cheap. In root's crontab:
#
#     0 3 * * * tailscale cert --cert-file /etc/nginx/tls/beonedge-vps.tail4ea2bc.ts.net.crt --key-file /etc/nginx/tls/beonedge-vps.tail4ea2bc.ts.net.key beonedge-vps.tail4ea2bc.ts.net && nginx -s reload
#
# An expired certificate locks every operator out of the console, so treat that
# job as part of the deployment rather than an optional extra.
#
# ── UFW ─────────────────────────────────────────────────────────────────────
# ufw default-denies inbound on ALL interfaces, including tailscale0, so both
# ports must be allowed explicitly:
#     sudo ufw allow in on tailscale0 to any port 80
#     sudo ufw allow in on tailscale0 to any port 443
#
# ── ORIGIN ALLOWLIST (backend .env) ─────────────────────────────────────────
# The backend allowlists the exact browser Origin and rejects everything else
# with 403 CSRF_INVALID — including a same-origin request whose Referer is not
# listed. This host must be added to WEB_ORIGIN_ALLOWLIST or the console cannot
# even fetch its CSRF token:
#
#     WEB_ORIGIN_ALLOWLIST=https://dev-app.beonedge.in,https://localhost,https://beonedge-vps.tail4ea2bc.ts.net
#
# The entry is https, so release_manager's deploy gate (which requires every
# allowlist entry to be an unspaced https:// origin) accepts it. Leave
# WEB_COOKIE_SECURE=true: this vhost is HTTPS, so the hardened cookie names work.
#
# ── SAME-ORIGIN CONTRACT ────────────────────────────────────────────────────
# The browser loads the page and calls the API on the SAME origin:
#     https://beonedge-vps.tail4ea2bc.ts.net/           → admin SPA
#     https://beonedge-vps.tail4ea2bc.ts.net/api/...    → backend
# so there is no CORS preflight, cookies are host-only, and CSRF protection is
# straightforward.
#
# This only holds if the admin image was built with a RELATIVE api base —
# release_manager/export.sh bakes `/api` for the admin build precisely so the
# bundle calls whichever host served it. An absolute origin pointing at
# dev-app.beonedge.in makes every call cross-site, which fails three ways at
# once: CORS emits no Access-Control-Allow-Origin, validateWebOrigin rejects
# `Sec-Fetch-Site: cross-site`, and SameSite=Lax cookies are not sent.
#
# ── THE ANDROID ADMIN APK DOES NOT USE THIS VHOST ───────────────────────────
# The APK is a Capacitor WebView on https://localhost calling
# https://dev-app.beonedge.in/api. That is cross-site by construction, so it
# cannot use cookies and authenticates with a native bearer token instead (see
# backend_controller/src/domain/admin/adminAccess.ts). Nothing here affects it,
# and it needs no entry in this file.
#
# ── WHY proxy_pass HAS A TRAILING SLASH ─────────────────────────────────────
# The backend's real routes have NO /api prefix — they are /health/ready,
# /v1/health, /auth/..., and so on. A trailing slash on proxy_pass makes nginx
# STRIP the matched /api/ prefix:
#     /api/health/ready  →  /health/ready
#     /api/v1/portfolio  →  /v1/portfolio
# If the backend is ever changed to serve routes under /api itself, remove the
# trailing slash from proxy_pass here and in every other BOE_APP site config.
#
# ── WHICH STACK THIS TALKS TO ───────────────────────────────────────────────
# The dev stack: admin SPA 47422 (boe-dev-admin), backend 47423 (boe-dev-backend).
#
# That is deliberate and it is the only admin console there is. There is no public
# admin domain — no admin.beonedge.in, no dev-admin.beonedge.in — so this vhost is
# the single browser door to the console.
#
# When the production stack goes live, decide explicitly which one an operator
# reaching this hostname should get, and change BOTH ports together:
#     dev  → 47422 (admin SPA) + 47423 (backend)
#     prod → 47412 (admin SPA) + 47413 (backend)
# Getting this half-right is worse than either choice: an operator who believes
# they are on dev while the console is wired to prod will act on real investor
# data. Verify after any change with
#   curl -s https://beonedge-vps.tail4ea2bc.ts.net/api/health/live
# and confirm the version it reports is the stack you meant.
# ─────────────────────────────────────────────────────────────────────────────

# ── :80 — redirect only, never serves the console ───────────────────────────
# Plain HTTP cannot hold a __Host- session cookie, so this block serves no app
# content at all; it exists to move browsers (and stale admin.boe.app.internal
# bookmarks) onto HTTPS.
server {
    listen 80;
    listen [::]:80;

    server_name beonedge-vps.tail4ea2bc.ts.net admin.boe.app.internal;

    # Layer 2 of 2 — see header. Required even on a redirect-only block, which
    # shares the wildcard :80 socket with the Cloudflare-Tunnel vhosts.
    allow 100.64.0.0/10;    # tailscale CGNAT range
    allow 127.0.0.1;
    allow ::1;
    deny all;

    include /etc/nginx/snippets/boe-security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    return 301 https://beonedge-vps.tail4ea2bc.ts.net$request_uri;
}

# ── :443 — the admin console ────────────────────────────────────────────────
server {
    # Shared wildcard :443 — name-based routing, NOT a dedicated socket. This is
    # currently the only TLS server block on this host, so it also answers as the
    # default for any other Host on 443; the guard below is what keeps it private,
    # not the name.
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name beonedge-vps.tail4ea2bc.ts.net;

    # ── network guard (layer 2 of 2 — see header) ───────────────────────────
    # Tailnet devices and loopback only. Everything else gets 403 even with a
    # correct Host header and a valid TLS session.
    allow 100.64.0.0/10;    # tailscale CGNAT range
    allow 127.0.0.1;
    allow ::1;
    deny all;

    # Issued and renewed by `tailscale cert` — see CERTIFICATE in the header.
    ssl_certificate     /etc/nginx/tls/beonedge-vps.tail4ea2bc.ts.net.crt;
    ssl_certificate_key /etc/nginx/tls/beonedge-vps.tail4ea2bc.ts.net.key;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:boe_admin_tls:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    include /etc/nginx/snippets/boe-security-headers.conf;

    # HSTS is deliberately NOT set, matching boe-security-headers.conf: it is hard
    # to undo once browsers cache it, and this hostname is new. Enable it there
    # only after it has served HTTPS reliably for a while.

    # Keep the console out of search results. Harmless belt-and-braces on a
    # tailnet-only name, and it is at server level so the included security
    # headers still apply (see the snippet's add_header inheritance note).
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Uploads and document submissions.
    client_max_body_size 10m;

    # ── authentication endpoints: strictest limit ───────────────────────────
    # Declared before the general /api/ block so it wins for these exact paths.
    # The browser console signs in at /v1/auth/web/login; the native path is here
    # too so one rule covers both if the APK is ever pointed at this host.
    #
    # Sign-in is expensive server-side (Argon2id, ~19 MiB per attempt), so this
    # protects CPU as well as credentials. It cannot be the only such protection:
    # a limit keyed on the client address does nothing about a scan spread across
    # many addresses, which is why the backend additionally bounds hashing
    # concurrency (see backend_controller/src/auth/passwordGate.ts).
    #
    # Anchored with $ and naming only `login`: /v1/auth/web/csrf and
    # /v1/auth/web/refresh are called routinely by a healthy console, and a 5r/m
    # limit on those would break it.
    #
    # A regex location cannot carry a URI on proxy_pass, so the /api prefix is
    # stripped with `rewrite ... break` instead of a trailing slash.
    location ~ ^/api/v1/auth/(native|web)/login$ {
        limit_req zone=boe_auth burst=10 nodelay;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:47423;

        proxy_buffering off;
    }

    # ── backend API ─────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=boe_general burst=40 nodelay;

        # Trailing slash strips /api/ — see the header note.
        proxy_pass http://127.0.0.1:47423/;

        # Streaming responses must not be buffered.
        proxy_buffering off;
    }

    # ── WebSocket ───────────────────────────────────────────────────────────
    # The backend has NO WebSocket support today (no ws / socket.io /
    # @fastify/websocket anywhere). Uncomment when it does.
    #
    # location /ws/ {
    #     proxy_pass http://127.0.0.1:47423/;
    #     proxy_set_header Upgrade    $http_upgrade;
    #     proxy_set_header Connection $connection_upgrade;
    #     proxy_read_timeout 3600s;
    #     proxy_send_timeout 3600s;
    # }

    # ── health probes: never public ─────────────────────────────────────────
    # Exposing readiness leaks dependency state and gives an unauthenticated
    # caller a cheap liveness oracle. Loopback-only even inside the tailnet.
    location /api/health/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:47423/health/;
    }

    # ── admin SPA ────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:47422;
    }
}
