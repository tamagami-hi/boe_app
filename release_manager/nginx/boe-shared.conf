# ─────────────────────────────────────────────────────────────────────────────
# boe-shared.conf — http-level directives shared by every BOE_APP site.
#
# INSTALL TO:  /etc/nginx/conf.d/boe-shared.conf
#
# It must live in conf.d/ (not sites-available/) because `map` and
# `limit_req_zone` are only valid in the http context, and every site config
# below references them.
#
#     sudo cp boe-shared.conf /etc/nginx/conf.d/boe-shared.conf
#     sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

# WebSocket upgrade plumbing (plan §10.1). Harmless when unused — the backend has
# no WebSocket support yet, so the /ws/ blocks in the site configs are commented
# out. This map is here so enabling them later needs no http-level change.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── real client IP behind Cloudflare ────────────────────────────────────────
# Public traffic now arrives via the Cloudflare Tunnel: cloudflared runs on
# this host and connects to nginx over loopback, so $remote_addr is 127.0.0.1
# for EVERY visitor. The genuine visitor IP is only available in the
# CF-Connecting-IP header that Cloudflare sets at its edge.
#
# Without this section, the limit_req zones below would bucket every visitor
# into a single "client" (127.0.0.1), so one busy user would rate-limit the
# entire site, and logs/X-Forwarded-For would show only loopback addresses.
#
# set_real_ip_from whitelists which proxies may be trusted for the real-IP
# header. Loopback entries cover tunnel mode (cloudflared → nginx locally).
# The 15 official Cloudflare IPv4 edge ranges
# (https://www.cloudflare.com/ips-v4/) cover direct proxy-mode traffic, i.e.
# DNS records pointed straight at this host with the orange cloud on.
# NEVER trust X-Forwarded-For from arbitrary clients here: only connections
# from the addresses below may set the effective client IP; CF-Connecting-IP
# from anyone else is ignored.
#
# If Cloudflare changes its ranges, update this list (same source URL above).
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;
# Walk the full proxy chain when direct proxy-mode traffic adds extra hops.
real_ip_recursive on;

# ── rate limiting (plan §14) ────────────────────────────────────────────────
# Keyed on client address. These are a coarse outer guard; the application must
# still enforce its own limits on login, OTP, password reset and payments,
# because a single IP can front many users and one user can rotate IPs.
limit_req_zone $binary_remote_addr zone=boe_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=boe_auth:10m    rate=5r/m;
limit_req_zone $binary_remote_addr zone=boe_monitor:10m rate=10r/s;

# POST /api/newuser is the marketing site's signup door. It is authenticated by a
# shared secret the backend checks (x-signup-key), so this limit is not the
# access control — it is a blast-radius cap for a leaked key, and a brake on
# accidental retry storms, since every accepted call queues an email.
#
# The rate is deliberately well above the general signup rate, because these
# limits key on $binary_remote_addr and this caller is server-side: every signup
# on beonedge.in arrives from that site's single egress address. The budget is
# therefore shared by ALL signups, not spent per visitor. A per-visitor-sized
# limit here would throttle a campaign spike and reject real people.
limit_req_zone $binary_remote_addr zone=boe_signup:10m  rate=60r/m;

# Return 429 rather than the default 503, which is misleading for a rate limit.
limit_req_status 429;
limit_conn_status 429;

# ── shared proxy behaviour ──────────────────────────────────────────────────
# Real client address and scheme, so the backend can build correct absolute URLs
# and log genuine client IPs rather than 127.0.0.1.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

proxy_http_version 1.1;

proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# Do not leak the upstream server version.
proxy_hide_header X-Powered-By;

# ── security headers (plan §13) ─────────────────────────────────────────────
# These live in /etc/nginx/snippets/boe-security-headers.conf and are included
# inside every site server block. They must NOT be declared here at http level:
# add_header inheritance is all-or-nothing, and any vhost that sets its own
# add_header (the dev and monitor hosts set X-Robots-Tag) would silently lose
# every header declared here.

# Nginx status endpoint for the metrics exporter, loopback only.
server {
    listen 127.0.0.1:8080;
    server_name _;

    location = /nginx_status {
        stub_status;
        allow 127.0.0.1;
        allow 172.16.0.0/12;   # docker networks (monitoring exporter)
        deny all;
        access_log off;
    }

    location / { return 404; }
}
