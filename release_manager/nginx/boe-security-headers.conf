# ─────────────────────────────────────────────────────────────────────────────
# boe-security-headers.conf — security headers shared by every BOE_APP server
# block.
#
# INSTALL TO:  /etc/nginx/snippets/boe-security-headers.conf
#
# This is an INCLUDE FILE, not a standalone config. It is pulled into every
# server block with:
#     include /etc/nginx/snippets/boe-security-headers.conf;
#
# ── WHY AN INCLUDE INSTEAD OF http-LEVEL add_header ─────────────────────────
# nginx add_header inheritance is all-or-nothing: as soon as ANY add_header is
# declared at a child level (server or location), NONE of the parent's headers
# are inherited. The dev and monitor vhosts set X-Robots-Tag at server level,
# which silently dropped every security header when these lived in the http
# context of boe-shared.conf. Including this file inside each server block puts
# the headers at the same level as X-Robots-Tag, so both apply.
#
# The same trap applies one level down: any location with its own add_header
# (e.g. Cache-Control on immutable assets) must also include this file if it
# should keep the security headers.
#
# ── SCOPE ───────────────────────────────────────────────────────────────────
# Deliberately conservative. Content-Security-Policy is NOT set here: it must be
# tailored to the actual bundles, fonts, charting libraries and payment
# integrations, and a wrong CSP breaks the app in ways that are hard to diagnose.
add_header X-Content-Type-Options "nosniff"                         always;
add_header X-Frame-Options        "DENY"                            always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;

# HSTS is intentionally commented out. Enable it only once every hostname has
# worked over HTTPS for a while — it is hard to undo, because browsers cache it.
# Do NOT add includeSubDomains until every subdomain is permanently HTTPS.
# add_header Strict-Transport-Security "max-age=31536000" always;
