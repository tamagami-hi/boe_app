# ─────────────────────────────────────────────────────────────────────────────
# beonedge.in / www.beonedge.in — PRODUCTION public landing site.
#
# INSTALL TO:  /etc/nginx/sites-available/boe-landing
# REQUIRES:    /etc/nginx/conf.d/boe-shared.conf
#
#     sudo certbot --nginx -d beonedge.in -d www.beonedge.in
#
# The landing site is the Next.js app on 127.0.0.1:47410 (LANDING_PORT). It has
# its own signup proxy that talks to the backend over the internal docker
# network, so this vhost does not need to expose /api at all — and deliberately
# does not, keeping the public API surface confined to app./admin.
# ─────────────────────────────────────────────────────────────────────────────

# www → apex, so there is one canonical origin for cookies and SEO.
server {
    listen 80;
    listen [::]:80;

    server_name www.beonedge.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://beonedge.in$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;

    server_name beonedge.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    client_max_body_size 4m;

    # The signup form posts here; it is a credential-adjacent endpoint, so it
    # gets the strict limit rather than the general one.
    location /api/signup {
        limit_req zone=boe_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:47410;
        proxy_buffering off;
    }

    # Next.js static assets are immutable and content-hashed.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:47410;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        limit_req zone=boe_general burst=40 nodelay;
        proxy_pass http://127.0.0.1:47410;
    }
}
