server {
    listen 80;
    listen [::]:80;

    server_name admin.boe.app.internal;

    allow 100.64.0.0/10;
    allow 127.0.0.1;
    allow ::1;
    deny all;

    include /etc/nginx/snippets/boe-security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    return 301 https://boe-prod-admin.tail4ea2bc.ts.net$request_uri;
}

server {
    listen 47491;

    server_name boe-prod-admin.tail4ea2bc.ts.net;

    allow 10.251.47.0/24;
    deny all;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  443;

    include /etc/nginx/snippets/boe-security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    client_max_body_size 10m;

    location ~ ^/api/v1/auth/(?:native|web|client/web|admin/native)/login$ {
        if (-f /srv/dev_stack/BOE_APP/prod_release/maintenance/active) {
            return 503;
        }
        error_page 503 = @boe_api_maintenance;
        limit_req zone=boe_auth burst=10 nodelay;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:47413;

        proxy_buffering off;
    }

    location /api/ {
        if (-f /srv/dev_stack/BOE_APP/prod_release/maintenance/active) {
            return 503;
        }
        error_page 503 = @boe_api_maintenance;
        limit_req zone=boe_general burst=40 nodelay;

        proxy_pass http://127.0.0.1:47413/;

        proxy_buffering off;
    }

    location /api/health/ {
        return 404;
    }

    location = /api/metrics {
        return 404;
    }

    location @boe_api_maintenance {
        include /etc/nginx/snippets/boe-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-BOE-Maintenance "1" always;
        add_header Retry-After "60" always;
        add_header Cache-Control "no-store" always;
        add_header Vary "Origin" always;
        add_header Access-Control-Allow-Origin $boe_maintenance_cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Expose-Headers "x-boe-maintenance, retry-after, x-request-id" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "content-type, authorization, idempotency-key, if-match, x-csrf-token, x-request-id, x-client-platform, x-app-version" always;
        add_header Access-Control-Max-Age "60" always;
        default_type application/json;
        if ($request_method = OPTIONS) {
            return 204;
        }
        return 503 '{"ok":false,"data":null,"error":{"code":"SERVICE_MAINTENANCE","message":"BeOnEdge is being updated. Please try again in a few minutes.","retryable":true},"meta":{}}';
    }

    location = /maintenance/index.html {
        internal;
        root /srv/dev_stack/BOE_APP/prod_release;
        expires -1;
    }

    location / {
        if (-f /srv/dev_stack/BOE_APP/prod_release/maintenance/active) {
            return 503;
        }
        error_page 503 /maintenance/index.html;
        proxy_pass http://127.0.0.1:47412;
    }
}
