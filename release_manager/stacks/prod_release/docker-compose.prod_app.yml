# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.prod_app.yml — BeOnEdge PRODUCTION application stack.
#
# Runs on the VPS at /srv/dev_stack/BOE_APP/prod_release.
# Brought up exclusively by ./prod_deploy.sh (never by hand), which supplies
# --env-file and --project-name.
#
# NETWORK CONTRACT
#   • Every published port binds to 127.0.0.1 only. Host nginx is the sole
#     public entry point; nothing here is reachable from the LAN or internet.
#   • Postgres has NO host port binding at all. It is only reachable over the
#     internal Docker network. (This also avoids the host postgres already
#     listening on 127.0.0.1:5432.)
#   • prod_internal is `internal: true`, so the database has no route off-host.
#
# IMAGE CONTRACT
#   Images are never built here. They arrive as tarballs and are loaded by
#   prod_deploy.sh, then referenced by the exact version in BOE_VERSION.
#   No `:latest` anywhere — a rollback must be able to name a precise image.
#
# STARTUP ORDER
#   postgres (healthy) → migrate (completed) → seed (completed) → backend
#   → workers + frontends. Enforced by depends_on conditions, so a single
#   `up -d` is correct and migrations always run before the backend serves.
#
# WORKERS
#   payments/email/sips workers are the SAME backend image with different
#   commands. Without them a paid order never confirms or books, and SIP
#   installments are never generated. They are not optional.
# ─────────────────────────────────────────────────────────────────────────────

x-security: &security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  init: true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-worker-health: &worker-health
  test: ["CMD-SHELL", "test -f /tmp/boe-worker-ready"]
  interval: 5s
  timeout: 2s
  retries: 3
  start_period: 30s

x-payments-worker-health: &payments-worker-health
  test: ["CMD-SHELL", "node dist/scripts/check-worker-health.js payment_reconciliation 120"]
  interval: 30s
  timeout: 5s
  retries: 2
  start_period: 60s

x-email-worker-health: &email-worker-health
  test: ["CMD-SHELL", "node dist/scripts/check-worker-health.js email_dispatch 60"]
  interval: 30s
  timeout: 5s
  retries: 2
  start_period: 60s

x-collections-worker-health: &collections-worker-health
  test: ["CMD-SHELL", "node dist/scripts/check-worker-health.js mandate_collection 180"]
  interval: 30s
  timeout: 5s
  retries: 2
  start_period: 60s

x-sips-worker-health: &sips-worker-health
  test: ["CMD-SHELL", "node dist/scripts/check-worker-health.js sip_schedule 900"]
  interval: 60s
  timeout: 5s
  retries: 2
  start_period: 120s

x-backend-env: &backend-env
  NODE_ENV: ${NODE_ENV:-production}
  HOST: 0.0.0.0
  PORT: ${BACKEND_PORT}
  LOG_LEVEL: ${LOG_LEVEL:-info}

  DATA_STORE: postgres
  DB_DRIVER: postgres
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_NAME: ${POSTGRES_DB}
  DATABASE_USER: ${POSTGRES_USER}
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
  DATABASE_SSL: "false"
  MIGRATIONS_DIR: ./db/migrations

  PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
  CORS_ORIGIN: ${CORS_ORIGIN}
  WEB_ORIGIN_ALLOWLIST: ${WEB_ORIGIN_ALLOWLIST:-${CORS_ORIGIN}}
  WEB_COOKIE_SECURE: ${WEB_COOKIE_SECURE:-true}

  ACCESS_TOKEN_ISSUER: ${ACCESS_TOKEN_ISSUER}
  ACCESS_TOKEN_AUDIENCE: ${ACCESS_TOKEN_AUDIENCE}
  ACCESS_TOKEN_CURRENT_KID: ${ACCESS_TOKEN_CURRENT_KID}
  ACCESS_TOKEN_SIGNING_KEY: ${ACCESS_TOKEN_SIGNING_KEY}
  ACCESS_TOKEN_VERIFICATION_KEYS: ${ACCESS_TOKEN_VERIFICATION_KEYS}
  REFRESH_HMAC_KEY: ${REFRESH_HMAC_KEY}
  REFRESH_KEY_VERSION: ${REFRESH_KEY_VERSION:-rt1}
  CSRF_KEY_VERSION: ${CSRF_KEY_VERSION:-cs1}
  CURSOR_HMAC_KEY: ${CURSOR_HMAC_KEY}

  CRYPTO_TOKEN_HASH_KEY: ${CRYPTO_TOKEN_HASH_KEY}
  CRYPTO_TOKEN_HASH_KEY_VERSION: ${CRYPTO_TOKEN_HASH_KEY_VERSION:-tk1}
  CRYPTO_CONSENT_IP_HMAC_KEY: ${CRYPTO_CONSENT_IP_HMAC_KEY}
  CRYPTO_CONSENT_IP_HMAC_KEY_VERSION: ${CRYPTO_CONSENT_IP_HMAC_KEY_VERSION:-ck1}
  CRYPTO_RECIPIENT_HMAC_KEY: ${CRYPTO_RECIPIENT_HMAC_KEY}
  CRYPTO_RECIPIENT_HMAC_KEY_VERSION: ${CRYPTO_RECIPIENT_HMAC_KEY_VERSION:-rk1}
  CRYPTO_RECIPIENT_ENC_KEY: ${CRYPTO_RECIPIENT_ENC_KEY}
  CRYPTO_RECIPIENT_ENC_KEY_VERSION: ${CRYPTO_RECIPIENT_ENC_KEY_VERSION:-ek1}

  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-phonepe}
  PHONEPE_CLIENT_ID: ${PHONEPE_CLIENT_ID}
  PHONEPE_CLIENT_SECRET: ${PHONEPE_CLIENT_SECRET}
  PHONEPE_CLIENT_VERSION: ${PHONEPE_CLIENT_VERSION:-1}
  PHONEPE_ENV: ${PHONEPE_ENV:-production}
  PHONEPE_CALLBACK_USERNAME: ${PHONEPE_CALLBACK_USERNAME}
  PHONEPE_CALLBACK_PASSWORD: ${PHONEPE_CALLBACK_PASSWORD}
  PHONEPE_CALLBACK_URL: ${PHONEPE_CALLBACK_URL}
  PHONEPE_PUBLIC_CALLBACK_ORIGIN: ${PHONEPE_PUBLIC_CALLBACK_ORIGIN:-}
  PHONEPE_CHECKOUT_ALLOWED_ORIGINS: ${PHONEPE_CHECKOUT_ALLOWED_ORIGINS}
  PHONEPE_CHECKOUT_REDIRECT_URL: ${PHONEPE_CHECKOUT_REDIRECT_URL:-}
  PAYMENT_START_URL: ${PAYMENT_START_URL:-}
  PAYMENT_START_SECRET: ${PAYMENT_START_SECRET:-}
  PAYMENT_START_TTL_MS: ${PAYMENT_START_TTL_MS:-900000}
  PHONEPE_SUBSCRIPTION_CALLBACK_URL: ${PHONEPE_SUBSCRIPTION_CALLBACK_URL}
  PHONEPE_SUBSCRIPTION_EVENT_ALLOWLIST: ${PHONEPE_SUBSCRIPTION_EVENT_ALLOWLIST}
  PHONEPE_MERCHANT_ID: ${PHONEPE_MERCHANT_ID:-}
  PHONEPE_AUTOPAY_ENABLED: ${PHONEPE_AUTOPAY_ENABLED:-false}
  PHONEPE_AUTOPAY_COLLECTION_ENABLED: ${PHONEPE_AUTOPAY_COLLECTION_ENABLED:-false}
  PHONEPE_API_TIMEOUT_MS: ${PHONEPE_API_TIMEOUT_MS:-10000}
  PHONEPE_PAYMENT_EVENT_ALLOWLIST: ${PHONEPE_PAYMENT_EVENT_ALLOWLIST:-checkout.order.completed,checkout.order.failed}
  PAYMENT_RECONCILIATION_INTERVAL_SECONDS: ${PAYMENT_RECONCILIATION_INTERVAL_SECONDS:-30}
  PAYMENT_RECONCILIATION_LEASE_SECONDS: ${PAYMENT_RECONCILIATION_LEASE_SECONDS:-60}
  PAYMENT_RECONCILIATION_MAX_BACKOFF_SECONDS: ${PAYMENT_RECONCILIATION_MAX_BACKOFF_SECONDS:-900}
  PAYMENT_RECONCILIATION_EXPIRY_GRACE_SECONDS: ${PAYMENT_RECONCILIATION_EXPIRY_GRACE_SECONDS:-300}
  PAYMENT_RECONCILIATION_CLAIM_LIMIT: ${PAYMENT_RECONCILIATION_CLAIM_LIMIT:-25}
  PAYMENT_ATTEMPT_TTL_MS: ${PAYMENT_ATTEMPT_TTL_MS:-900000}

  EMAIL_VERIFICATION_FROM: ${EMAIL_VERIFICATION_FROM}
  EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST}
  EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-465}
  EMAIL_SMTP_USER: ${EMAIL_SMTP_USER}
  EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD}
  EMAIL_SMTP_SECURE: ${EMAIL_SMTP_SECURE:-true}
  EMAIL_WORKER_CLAIM_LIMIT: ${EMAIL_WORKER_CLAIM_LIMIT:-25}
  EMAIL_WORKER_LEASE_MS: ${EMAIL_WORKER_LEASE_MS:-60000}

  EMAIL_VERIFICATION_CODE_TTL_MS: ${EMAIL_VERIFICATION_CODE_TTL_MS:-600000}
  EMAIL_VERIFICATION_CODE_MAX_ATTEMPTS: ${EMAIL_VERIFICATION_CODE_MAX_ATTEMPTS:-5}
  EMAIL_VERIFICATION_RESEND_COOLDOWN_MS: ${EMAIL_VERIFICATION_RESEND_COOLDOWN_MS:-60000}

  SUPPORT_EMAIL: ${SUPPORT_EMAIL}

  # The only credential on POST /newuser. The marketing site (beonedge.in, on
  # AWS) is a standalone project that reaches this backend server-to-server, so
  # a shared secret is what identifies it — there is no browser Origin to trust.
  NEWUSER_SHARED_SECRET: ${NEWUSER_SHARED_SECRET}

  # In-app APK update feed. The release holder directories are mounted read-only
  # into the backend below; nginx serves the same directories publicly at
  # APK_DOWNLOAD_BASE_URL. Leave both blank to disable the update check — the
  # endpoint then answers "no update" rather than failing.
  # Shared read cache. Optional: with REDIS_URL unset the backend serves every
  # read from PostgreSQL, which is correct but puts the whole browse load on the
  # connection pool.
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  REDIS_KEY_NAMESPACE: ${REDIS_KEY_NAMESPACE:-boe-prod}
  CACHE_APP_CONFIG_TTL_MS: ${CACHE_APP_CONFIG_TTL_MS:-30000}
  CACHE_CATALOG_TTL_MS: ${CACHE_CATALOG_TTL_MS:-30000}
  CACHE_PUBLIC_CONTENT_TTL_MS: ${CACHE_PUBLIC_CONTENT_TTL_MS:-60000}

  APK_RELEASE_ROOT: ${APK_RELEASE_ROOT:-/srv/boe/apk}
  APK_DOWNLOAD_BASE_URL: ${APK_DOWNLOAD_BASE_URL}

  ADMIN_LOGIN_ID: ${ADMIN_LOGIN_ID}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD}
  ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-BeOnEdge}
  ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-Admin}
  ADMIN_PHONE: ${ADMIN_PHONE:-+910000000001}

  SEED_AUTH_ENABLED: ${SEED_AUTH_ENABLED:-true}
  SEED_AUTH_ALLOW_PRODUCTION: ${SEED_AUTH_ALLOW_PRODUCTION:-true}
  SEED_AUTH_OVERWRITE: ${SEED_AUTH_OVERWRITE:-false}
  SEED_ADMIN_EMAIL: ${ADMIN_LOGIN_ID}
  SEED_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
  SEED_CLIENT_EMAIL: ${SEED_CLIENT_EMAIL}

  # Concurrent-device policy for the client app. Signing in beyond the cap
  # revokes the OLDEST device's session rather than refusing the login, so a user
  # whose old phone is lost or wiped can always get back in. SEED_CLIENT_EMAIL
  # (above) is exempt: the dev/QA account runs on many emulators at once.
  MAX_NATIVE_DEVICES_PER_USER: ${MAX_NATIVE_DEVICES_PER_USER:-3}
  SEED_CLIENT_PASSWORD: ${SEED_CLIENT_PASSWORD}
  SEED_CLIENT_PHONE: ${SEED_CLIENT_PHONE:-+910000000003}
  SEED_CLIENT_FIRST_NAME: ${SEED_CLIENT_FIRST_NAME:-BeOnEdge}
  SEED_CLIENT_LAST_NAME: ${SEED_CLIENT_LAST_NAME:-Client}

services:
  # ── database ──────────────────────────────────────────────────────────────
  # No `ports:` on purpose. Reachable only as `postgres:5432` on prod_internal.
  # Not read_only: postgres requires writable storage.
  redis:
    image: redis:7.4-alpine
    container_name: ${BOE_CONTAINER_PREFIX:-boe-prod}-redis
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - prod_redis_data:/data
    networks:
      - prod_internal
    security_opt:
      - no-new-privileges:true
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    container_name: ${BOE_CONTAINER_PREFIX:-boe}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    networks:
      - prod_internal
    security_opt:
      - no-new-privileges:true
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── schema migrations (one-shot, gates the backend) ───────────────────────
  migrate:
    image: boe-prod-backend:${BOE_VERSION}
    container_name: ${BOE_CONTAINER_PREFIX:-boe}-migrate
    <<: *security
    command: ["npm", "run", "migrate"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - prod_internal
    restart: "no"

  # ── admin/user seeding (one-shot) ─────────────────────────────────────────
  seed:
    image: boe-prod-backend:${BOE_VERSION}
    container_name: ${BOE_CONTAINER_PREFIX:-boe}-seed
    <<: *security
    command: ["npm", "run", "seed:auth"]
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - prod_internal
    restart: "no"

  # ── shared backend (serves the user SPA + admin panel) ────────────────────
  backend:
    image: boe-prod-backend:${BOE_VERSION}
    container_name: ${BOE_CONTAINER_PREFIX:-boe}-backend
    <<: *security
    restart: unless-stopped
    environment: *backend-env
    # Published APKs, read-only. The update endpoint derives "is there a newer
    # build?" from the sidecar JSONs the release pipeline already writes here, so
    # shipping an APK is the only step needed to offer an update. Read-only
    # because the backend must never be able to alter a released artifact.
    volumes:
      - ${APK_CLIENT_DIR:-/srv/dev_stack/BOE_APP/prod_release/prod_apk}:/srv/boe/apk/client:ro
      - ${APK_ADMIN_DIR:-/srv/dev_stack/BOE_APP/prod_release/admin_apk}:/srv/boe/apk/admin:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${BACKEND_PORT}:${BACKEND_PORT}"
    networks:
      - prod_frontend
      - prod_internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── background workers (same image, different entrypoints) ────────────────
  payments-worker:
    image: boe-prod-backend:${BOE_VERSION}
    container_name: ${BOE_CONTAINER_PREFIX:-boe}-payments-worker
    <<: *security
    restart: unless-stopped
    command: ["node", "dist/paymentReconciliationEntrypoint.js"]
    environment: *backend-env
    healthcheck: *payments-worker-health
    depends_on:
      seed:
        condition: service_completed_successfully
    networks:
      - prod_egress
      - prod_internal

  email-worker:
    image: boe-prod-backend:${BOE_VERSION}
    container_name: ${BOE_CONTAINER_PREFIX:-boe}-email-worker
    <<: *security
    restart: unless-stopped
    command: ["sh", "-ec", "rm -f /tmp/boe-worker-ready; while true; do node dist/emailWorker.js; touch /tmp/boe-worker-ready; sleep ${EMAIL_WORKER_INTERVAL_SECONDS:-15}; done"]
    environment: *backend-env
    healthcheck: *email-worker-health
    depends_on:
      seed:
        condition: service_completed_successfully
    networks:
      # SMTP needs outbound access. This dedicated bridge has no frontend peers
      # and the worker publishes no ports.
      - prod_egress
      - prod_internal

  collections-worker:
    image: boe-prod-backend:${BOE_VERSION}
    container_name: ${BOE_CONTAINER_PREFIX:-boe}-collections-worker
    <<: *security
    restart: unless-stopped
    command: ["sh", "-ec", "rm -f /tmp/boe-worker-ready; while true; do node dist/mandateCollectionEntrypoint.js; touch /tmp/boe-worker-ready; sleep ${COLLECTION_WORKER_INTERVAL_SECONDS:-60}; done"]
    environment: *backend-env
    healthcheck: *collections-worker-health
    depends_on:
      seed:
        condition: service_completed_successfully
    networks:
      - prod_egress
      - prod_internal

  sips-worker:
    image: boe-prod-backend:${BOE_VERSION}
    container_name: ${BOE_CONTAINER_PREFIX:-boe}-sips-worker
    <<: *security
    restart: unless-stopped
    command: ["sh", "-ec", "rm -f /tmp/boe-worker-ready; while true; do node dist/sipScheduleEntrypoint.js; touch /tmp/boe-worker-ready; sleep ${SIP_WORKER_INTERVAL_SECONDS:-300}; done"]
    environment: *backend-env
    healthcheck: *sips-worker-health
    depends_on:
      seed:
        condition: service_completed_successfully
    networks:
      - prod_internal

  # ── user SPA (app.beonedge.in) ────────────────────────────────────────────
  # Static nginx-served bundle. Its API origin is baked in at BUILD time, so a
  # change of origin requires a rebuild, not an env edit.
  app_frontend:
    image: boe-prod-app:${BOE_VERSION}
    container_name: ${BOE_CONTAINER_PREFIX:-boe}-app
    <<: *security
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_FRONTEND_PORT}:8080"
    networks:
      - prod_frontend

  # ── admin SPA (admin.beonedge.in) ─────────────────────────────────────────
  # Same Dockerfile as app_frontend, built with a different app target.
  # Authorization is enforced server-side; serving admin on its own hostname is
  # isolation, never an authorization boundary.
  admin_frontend:
    image: boe-prod-admin:${BOE_VERSION}
    container_name: ${BOE_CONTAINER_PREFIX:-boe}-admin
    <<: *security
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ADMIN_FRONTEND_PORT}:8080"
    networks:
      - prod_frontend

networks:
  # Reachable from the host loopback via published ports; fronted by nginx.
  prod_frontend:
    name: ${COMPOSE_PROJECT_NAME:-boe_prod}_frontend
  # Outbound-only bridge for SMTP delivery; no service other than email-worker
  # is attached to this network.
  prod_egress:
    name: ${COMPOSE_PROJECT_NAME:-boe_prod}_egress
  # internal: true — no gateway, no route off-host. The database lives here.
  prod_internal:
    name: ${COMPOSE_PROJECT_NAME:-boe_prod}_internal
    internal: true

volumes:
  prod_redis_data:
  prod_postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-boe_prod}_postgres_data
    driver: local
