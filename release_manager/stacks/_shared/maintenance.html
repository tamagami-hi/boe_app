<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="30">
<meta name="robots" content="noindex">
<title>BeOnEdge is being updated</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  background: #f7f7f5;
  color: #0e1116;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  line-height: 1.6;
}
main {
  width: 100%;
  max-width: 460px;
  padding: 32px 28px;
  background: #faf9f6;
  border: 1px solid #e6e2d8;
  border-radius: 20px;
  box-shadow: 0 12px 32px -16px rgba(14, 17, 22, 0.25);
  text-align: center;
}
.mark {
  margin: 0 0 8px;
  color: #8a6428;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.04em;
}
h1 {
  margin: 0 0 12px;
  font-size: 24px;
  line-height: 1.3;
}
p {
  margin: 0 0 12px;
  color: #5c6470;
  font-size: 16px;
}
.small {
  margin: 20px 0 0;
  font-size: 14px;
}
</style>
</head>
<body>
<main>
<p class="mark">BeOnEdge</p>
<h1>We are updating BeOnEdge</h1>
<p>An update is being installed. This usually takes a few minutes.</p>
<p>Nothing you saved has been lost. Please come back shortly.</p>
<p class="small">This page reloads by itself every 30 seconds.</p>
</main>
</body>
</html>
