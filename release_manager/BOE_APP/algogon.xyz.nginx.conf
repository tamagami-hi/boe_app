# BeOnEdge edge proxy for algogon.xyz
# Host nginx (NOT a container): TLS termination + HTTP->HTTPS redirect, proxying
#   /v1/  -> backend_controller  (127.0.0.1:47502)   APK + landing server-side proxy
#   /     -> landing Next.js      (127.0.0.1:3100)    public education site
#
# Cert is provisioned by certbot (`certbot --nginx -d algogon.xyz -d www.algogon.xyz`).
# Renewal keeps the same /etc/letsencrypt/live/algogon.xyz/ paths, so this static
# vhost does not need to be re-edited on renewal.
#
# Install on the VPS host:
#   sudo cp algogon.xyz.nginx.conf /etc/nginx/sites-available/algogon.xyz
#   sudo ln -sf /etc/nginx/sites-available/algogon.xyz /etc/nginx/sites-enabled/algogon.xyz
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
  listen 80;
  listen [::]:80;
  server_name algogon.xyz www.algogon.xyz;

  # Let certbot answer ACME challenges over plain HTTP, then redirect everything else.
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name algogon.xyz www.algogon.xyz;

  ssl_certificate     /etc/letsencrypt/live/algogon.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/algogon.xyz/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # Single canonical origin (matches CORS_ORIGIN / PUBLIC_LANDING_ORIGIN in BOE_APP/.env).
  if ($host = www.algogon.xyz) { return 301 https://algogon.xyz$request_uri; }

  # Backend API — APK login/refresh/investing + landing server-side proxy.
  location /v1/ {
    proxy_pass http://127.0.0.1:47502;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin $http_origin;
  }

  # Public landing page (Next.js).
  location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
