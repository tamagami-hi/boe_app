# CI gate for `main` — the enforcement that replaces PR review in this workflow.
# Runs the backend invariant guards + tests, so a red build means
# "do not push to origin/main".

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: backend (guards + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_controller
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Static authorization-invariant guards (no DB needed).
      - run: npm run authz:admin-rbac
      - run: npm run authz:403
      # Colocated unit tests only (src/**/*.test.js).
      - run: node --test "src/**/*.test.js"
