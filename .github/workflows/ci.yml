name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_controller
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend_controller/.nvmrc
          cache: npm
          cache-dependency-path: backend_controller/package-lock.json
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run check
      - run: npm run test:integration -- --coverage.enabled=false

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_stack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend_controller/.nvmrc
          cache: npm
          cache-dependency-path: frontend_stack/package-lock.json
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm test
      - run: npm run build

  frontend-ts:
    name: Frontend TS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_stack_ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend_stack_ts/.nvmrc
          cache: npm
          cache-dependency-path: frontend_stack_ts/package-lock.json
      - run: npm install --global npm@11.16.0
      - name: Build contracts
        working-directory: packages/contracts
        run: npm ci && npm run build
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run generate:api:check
      - run: npm run build:client
      - run: npm run build:admin

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: packages/contracts/.nvmrc
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run check
