apply plugin: 'com.android.application'

// Release signing credentials live in android/keystore.properties, which is
// gitignored and must never be committed (like the keystore it points to).
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def hasReleaseKeystore = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
        .every { keystoreProperties[it] }

// Fail fast with an actionable message if a release build is requested without
// signing material, instead of silently producing an unsigned APK.
gradle.taskGraph.whenReady { graph ->
    def releaseRequested = graph.allTasks.any { it.name.toLowerCase().contains('release') }
    if (releaseRequested && !hasReleaseKeystore) {
        throw new GradleException(
            "Release build requested but signing is not configured.\n" +
            "Expected ${keystorePropertiesFile} with keys: storeFile, storePassword, keyAlias, keyPassword.\n" +
            "Create it via emu/boe_update.sh (see its keystore bootstrap) or generate one with keytool:\n" +
            "  keytool -genkeypair -keystore android/keystore/boe-release.jks -alias boe -keyalg RSA -keysize 2048 -validity 10000\n" +
            "KEEP THE KEYSTORE FOREVER: Android only installs an update over an existing app when the certificate matches.")
    }
}

android {
    namespace = "com.beonedge.app"
    compileSdk = rootProject.ext.compileSdkVersion

    // Launcher icon and splash come from a per-variant resource directory instead of
    // being copied into src/main/res before each build. The old copy step mutated
    // tracked files, so a `--both` run left admin branding behind and the next bare
    // Gradle build inherited it — the committed background colour was in fact the
    // admin red. Nothing here touches applicationId or signing: those stay exactly
    // as boe_update.sh injects them, because they decide update compatibility.
    def boeVariant = project.hasProperty('boeVariant') ? project.boeVariant : 'client'
    if (!['client', 'admin'].contains(boeVariant)) {
        throw new GradleException("-PboeVariant must be 'client' or 'admin', got '${boeVariant}'")
    }
    def brandingDir = file("../../resources/launcher/${boeVariant}")
    if (!brandingDir.isDirectory()) {
        throw new GradleException("Missing branding resources for '${boeVariant}': ${brandingDir}")
    }
    def boeClientApplicationId = "com.beonedge.app"
    def boeApplicationId = project.hasProperty('boeApplicationId') ? project.boeApplicationId : boeClientApplicationId
    if (boeVariant == 'admin' && boeApplicationId == boeClientApplicationId) {
        throw new GradleException(
            "-PboeVariant=admin needs -PboeApplicationId set to an admin id, e.g. com.beonedge.app.admin.\n" +
            "Building the admin console under the client applicationId installs it *over* the investor app:\n" +
            "same id means Android treats it as an update, so the client app is replaced and its data orphaned.\n" +
            "Use `npm run android:apk:admin`, or emu/boe_update.sh, which both inject the id."
        )
    }

    sourceSets {
        main {
            res.srcDirs += brandingDir
        }
    }

    // App Link host, derived from the applicationId rather than declared twice.
    //
    // The App Link and the applicationId have to describe the same environment: a dev
    // APK claiming app.beonedge.in would intercept production return URLs, and a prod
    // APK claiming dev-app.beonedge.in would silently fail to. Deriving the host from
    // the id makes that pairing impossible to get wrong by omission, which keeps bare
    // `npm run android:apk` builds correct too.
    //
    // emu/boe_update.sh still passes -PboeAppLinkHost explicitly. It is cross-checked
    // rather than trusted: if the builder's intent and the applicationId disagree, the
    // build fails here instead of shipping an APK that cannot verify its own links.
    def boeDevApplicationIdBase = "${boeClientApplicationId}.dev"
    def boeIsDevFamily = boeApplicationId == boeDevApplicationIdBase ||
        boeApplicationId.startsWith("${boeDevApplicationIdBase}.")
    def boeExpectedAppLinkHost = boeIsDevFamily ? 'dev-app.beonedge.in' : 'app.beonedge.in'
    def boeAppLinkHost = project.hasProperty('boeAppLinkHost') ? project.boeAppLinkHost : boeExpectedAppLinkHost
    if (boeAppLinkHost != boeExpectedAppLinkHost) {
        throw new GradleException(
            "App Link host does not match the applicationId being built.\n" +
            "  applicationId:      ${boeApplicationId}\n" +
            "  -PboeAppLinkHost:   ${boeAppLinkHost}\n" +
            "  expected for that id: ${boeExpectedAppLinkHost}\n" +
            "A development APK must never claim app.beonedge.in, and a production APK must\n" +
            "never claim dev-app.beonedge.in: the wrong pairing either hijacks the other\n" +
            "environment's return URLs or fails Digital Asset Links verification outright."
        )
    }


    defaultConfig {
        // emu/boe_update.sh injects -PboeApplicationId so dev/prod and
        // client/admin APKs get distinct IDs and can coexist on one device;
        // the literal is only a fallback for bare IDE builds.
        applicationId boeApplicationId
        // Consumed by the App Link intent-filter in AndroidManifest.xml. Never a literal
        // there: the shared manifest must not name one environment's host.
        manifestPlaceholders = [boeAppLinkHost: boeAppLinkHost]
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // emu/boe_update.sh injects -PboeVersionCode/-PboeVersionName; the
        // literals are only a fallback for bare IDE builds.
        versionCode project.hasProperty('boeVersionCode') ? boeVersionCode.toInteger() : 1
        versionName project.hasProperty('boeVersionName') ? boeVersionName : "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            debuggable true
            if (project.findProperty('boeSignDebugWithRelease') == 'true') {
                if (!hasReleaseKeystore) {
                    throw new GradleException('Debug release signing requested but signing is not configured.')
                }
                signingConfig signingConfigs.release
            }
        }
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
